name: Build and Release

on:
  push:
    branches:
      - jcasc-main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode package -DskipTests

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ steps.sha.outputs.short }}
          name: "Build ${{ steps.sha.outputs.short }}"
          body: |
            Automated build from branch `jcasc-main`.

            **Commit:** ${{ github.sha }}

            ### Changes
            - JCasC support for `hostConfigurations`
            - Install the `.hpi` file via **Manage Jenkins → Plugins → Advanced → Deploy Plugin**
          artifacts: target/publish-over-ssh.hpi
          artifactContentType: application/octet-stream
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
