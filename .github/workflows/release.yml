name: Build and Release

on:
  push:
    branches:
      - jcasc-main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compute JEP-229 version
        id: ver
        run: |
          COUNT=$(git rev-list --count HEAD)
          HASH=$(git rev-parse --short HEAD)
          echo "version=${COUNT}.v${HASH}_" >> $GITHUB_OUTPUT

          # Generate changelog from commits since last tag, or last 20 commits if no tag exists
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log "${LAST_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log -20 --pretty=format:"- %s" --no-merges)
          fi
          # Write multiline output safely
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<${EOF}" >> $GITHUB_OUTPUT
          echo "${CHANGELOG}" >> $GITHUB_OUTPUT
          echo "${EOF}" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: mvn --batch-mode package -DskipTests -Dchangelist=${{ steps.ver.outputs.version }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.ver.outputs.version }}
          name: "${{ steps.ver.outputs.version }}"
          commit: ${{ github.sha }}
          body: |
            Automated build from branch `jcasc-main`.

            **Commit:** ${{ github.sha }}

            ### Changes
            ${{ steps.ver.outputs.changelog }}

            ---
            Install the `.hpi` file via **Manage Jenkins → Plugins → Advanced → Deploy Plugin**
          artifacts: target/publish-over-ssh.hpi
          artifactContentType: application/octet-stream
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
